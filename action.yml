name: "AIComply — EU AI Act & GDPR Compliance Scanner"
description: >
  Deterministic static analysis and taint tracking engine for EU AI Act (Regulation 2024/1689)
  and GDPR compliance. Scans Python source code, supply chain manifests, and container infrastructure.
  Optionally signs audit evidence with Ed25519 and uploads SARIF reports to GitHub Advanced Security.

branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Path to the repository or directory to scan. Defaults to the workspace root."
    required: false
    default: "."

  format:
    description: "Output format: terminal | json | markdown | sarif. Defaults to sarif for CI use."
    required: false
    default: "sarif"

  output:
    description: "Path to save the scan report. Defaults to aicomply-results.sarif."
    required: false
    default: "aicomply-results.sarif"

  sign:
    description: "Sign the report with an Ed25519 private key to generate a tamper-proof evidence bundle."
    required: false
    default: "false"

  key:
    description: "Path to the Ed25519 private key (.pem) for signing. Required if sign is true."
    required: false
    default: ""

  signer-id:
    description: "Identity of the signer (e.g. secops-ci@company.com). Embedded in the signed bundle."
    required: false
    default: ""

  enforce-risk-tier:
    description: |
      Block the workflow if the scan finds violations above this risk tier.
      Accepted values: prohibited | high_risk | limited_risk | minimal_risk
    required: false
    default: ""

  upload-sarif:
    description: "Upload the SARIF report to GitHub Advanced Security (requires security-events: write permission)."
    required: false
    default: "true"

  python-version:
    description: "Python version to use. Minimum required: 3.11."
    required: false
    default: "3.11"

  aicomply-version:
    description: "AIComply CLI version to install. Defaults to latest stable."
    required: false
    default: "aicomply-cli"

outputs:
  sarif-file:
    description: "Path to the generated SARIF report file."
    value: ${{ inputs.output }}

  findings-count:
    description: "Total number of compliance violations found."
    value: ${{ steps.parse-results.outputs.findings_count }}

  scan-status:
    description: "Scan outcome: compliant | violations_found | error"
    value: ${{ steps.run-scan.outputs.scan_status }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install AIComply CLI
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ inputs.aicomply-version }}"

    - name: Execute AIComply Compliance Scan
      id: run-scan
      shell: bash
      run: |
        CMD="aicomply scan ${{ inputs.path }} --format ${{ inputs.format }} --output ${{ inputs.output }}"

        if [ "${{ inputs.sign }}" = "true" ]; then
          if [ -z "${{ inputs.key }}" ]; then
            echo "::error::inputs.sign is true but inputs.key is empty."
            exit 1
          fi
          CMD="$CMD --sign --key ${{ inputs.key }}"
          if [ -n "${{ inputs.signer-id }}" ]; then
            CMD="$CMD --signer-id ${{ inputs.signer-id }}"
          fi
        fi

        $CMD
        EXIT_CODE=$?

        if [ $EXIT_CODE -eq 0 ]; then
          echo "scan_status=compliant" >> $GITHUB_OUTPUT
        elif [ $EXIT_CODE -eq 1 ]; then
          echo "scan_status=violations_found" >> $GITHUB_OUTPUT
          if [ -n "${{ inputs.enforce-risk-tier }}" ]; then
            echo "::warning::Risk tier gate enforced. Violations detected — blocking workflow."
            exit 1
          fi
        else
          echo "scan_status=error" >> $GITHUB_OUTPUT
          exit $EXIT_CODE
        fi

    - name: Parse findings count from SARIF
      id: parse-results
      shell: bash
      if: always()
      run: |
        SARIF_FILE="${{ inputs.output }}"
        if [ -f "$SARIF_FILE" ]; then
          COUNT=$(python3 -c "
        import json
        with open('$SARIF_FILE') as f:
            data = json.load(f)
        print(sum(len(run.get('results', [])) for run in data.get('runs', [])))
          " 2>/dev/null || echo 0)
          echo "findings_count=$COUNT" >> $GITHUB_OUTPUT
        else
          echo "findings_count=0" >> $GITHUB_OUTPUT
        fi

    - name: Upload SARIF to GitHub Advanced Security
      uses: github/codeql-action/upload-sarif@v4
      if: always() && inputs.upload-sarif == 'true' && inputs.format == 'sarif'
      with:
        sarif_file: ${{ inputs.output }}
        category: "aicomply-eu-ai-act-gdpr"
