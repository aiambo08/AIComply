[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aicomply"
version = "0.1.0"
description = "Deterministic EU AI Act Compliance CLI Scanner"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aibo Ni" }]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
aicomply = "aicomply.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aicomply = ["rules/**/*.yaml", "rules/**/*.yml", "rules/*.yaml"]