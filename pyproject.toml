[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aicomply-cli"
version = "2.0.0-alpha"
description = "Deterministic EU AI Act & GDPR Compliance SAST, Taint Tracking & Infrastructure Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aibo Ni" }]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
aicomply = "aicomply.cli:app"
aicomply-cli = "aicomply.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aicomply" = [
    "rules/**/*.yaml",
    "rules/**/*.yml",
    "rules/*.yaml",
    "rules/*.yml",
    "ui/static/*.html",
    "ui/static/**/*"
]