[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aicomply-cli"
version = "2.0.0-alpha"
description = "Deterministic EU AI Act & GDPR Compliance SAST, Taint Tracking & Infrastructure Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aibo Ni" }]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff==0.12.12",
    "mypy==1.17.1",
    "build==1.3.0",
    "setuptools==80.9.0",
    "wheel==0.45.1"
]

[project.scripts]
aicomply = "aicomply.cli:app"
aicomply-cli = "aicomply.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aicomply" = [
    "rules/**/*.yaml",
    "rules/**/*.yml",
    "rules/*.yaml",
    "rules/*.yml",
    "ui/static/*.html",
    "ui/static/**/*"
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = ["src/aicomply/classifier"]
strict = true
follow_imports = "silent"