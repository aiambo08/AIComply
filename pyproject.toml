[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aicomply-cli"
version = "2.0.0a0"
description = "Local static analysis of AI code risks with EU AI Act and GDPR review evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aibo Ni" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance"
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "cryptography>=42.0.0"
]

[project.urls]
Homepage = "https://github.com/aiambo08/AIComply"
Documentation = "https://github.com/aiambo08/AIComply#readme"
Issues = "https://github.com/aiambo08/AIComply/issues"
Changelog = "https://github.com/aiambo08/AIComply/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff==0.12.12",
    "mypy==1.17.1",
    "build==1.3.0",
    "setuptools==80.9.0",
    "wheel==0.45.1",
    "twine==6.1.0",
]

[project.scripts]
aicomply = "aicomply.cli:app"
aicomply-cli = "aicomply.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aicomply" = [
    "rules/**/*.yaml",
    "rules/**/*.yml",
    "rules/*.yaml",
    "rules/*.yml",
    "ui/static/*.html",
    "ui/static/**/*"
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = ["src/aicomply/classifier"]
strict = true
follow_imports = "silent"
