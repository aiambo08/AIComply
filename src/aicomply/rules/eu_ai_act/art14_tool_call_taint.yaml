id: EUAIA-ART14-002
article: "Art. 14(4)(a) & Art. 15(1)"
title: "Ejecución autónoma de comandos del sistema con salida de IA no validada"
severity: CRITICAL
risk_tier: high_risk
confidence: HIGH
description: "Se detectó un flujo de contenido de un LLM hacia funciones de ejecución (os.system, subprocess, eval, exec). Validar tipos o invocar una función con nombre de control no demuestra que los comandos estén restringidos."
remediation: "Use un conjunto cerrado de acciones con ejecutables y argumentos constantes, rechace acciones desconocidas y revise la autorización efectiva antes de ejecutar. Un campo command: str en Pydantic o una función llamada human_gate no demuestra seguridad; los controles reales requieren revisión contextual."
max_fine: "35M€ o 7%"
patterns:
  - type: data_flow
    data_flow:
      sources:
        - target: "openai.chat.completions.create"
        - target: "openai.responses.create"
        - target: "openai.AsyncOpenAI.chat.completions.create"
        - target: "openai.AsyncOpenAI.responses.create"
        - target: "openai.AzureOpenAI.chat.completions.create"
        - target: "openai.AzureOpenAI.responses.create"
        - target: "openai.AsyncAzureOpenAI.chat.completions.create"
        - target: "openai.AsyncAzureOpenAI.responses.create"
        - target: "anthropic.messages.create"
        - target: "anthropic.AsyncAnthropic.messages.create"
        - target: "google.genai.Client.models.generate_content"
        - target: "google.genai.Client.aio.models.generate_content"
        - target: "litellm.completion"
        - target: "model.generate"
      sanitizers:
        - target: "guardrails.validate"
      sinks:
        - target: "os.system"
        - target: "subprocess.run"
        - target: "subprocess.Popen"
        - target: "subprocess.check_output"
        - target: "subprocess.call"
        - target: "eval"
        - target: "exec"
