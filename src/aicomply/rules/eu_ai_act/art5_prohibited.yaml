- id: "EUAIA-ART05-001"
  article: "Art. 5(1)(f)"
  title: "Inferencia de emociones en el lugar de trabajo o centros educativos"
  severity: "CRITICAL"
  risk_tier: "prohibited"
  description: "Detección de librerías o llamadas a funciones destinadas a inferir estados emocionales de personas en entornos laborales o educativos sin fines médicos/de seguridad."
  remediation: "Eliminar el módulo de análisis de emociones o restringir su alcance a entornos no prohibidos expresamente por el Art. 5."
  max_fine: "35M€ o 7% facturación global"
  confidence: "HIGH"
  patterns:
    - type: "ast_import"
      target: "fer"
    - type: "ast_import"
      target: "feat"
    - type: "ast_call"
      target: "DeepFace.analyze"
      match_args:
        actions: "emotion"

- id: "EUAIA-ART05-002"
  article: "Art. 5(1)(c)"
  title: "Puntuación social (Social Scoring)"
  severity: "CRITICAL"
  risk_tier: "prohibited"
  description: "Evaluación o clasificación de personas físicas basada en su comportamiento social o rasgos de personalidad con fines de calificación discriminatoria."
  remediation: "Eliminar algoritmos de cálculo de fiabilidad o puntuación social generalizada de usuarios."
  max_fine: "35M€ o 7% facturación global"
  confidence: "MEDIUM"
  patterns:
    - type: "ast_call"
      target: "compute_social_score"
    - type: "ast_call"
      target: "evaluate_citizen_trust"