- id: "EUAIA-ART14-001"
  article: "Art. 14"
  title: "Ejecución autónoma sin compuerta de supervisión humana (Human-in-the-loop)"
  severity: "HIGH"
  risk_tier: "high_risk"
  description: "Los sistemas de alto riesgo deben incorporar mecanismos de supervisión humana que permitan a personas físicas intervenir o anular decisiones críticas automatizadas."
  remediation: "Introducir un mecanismo explícito de confirmación manual, compuerta de aprobación (human approval gate) o flag de override antes de disparar acciones irreversibles."
  max_fine: "15M€ o 3% facturación global"
  confidence: "MEDIUM"
  patterns:
    - type: "ast_call"
      target: "auto_execute_decision"
    - type: "ast_call"
      target: "execute_autonomous_action"