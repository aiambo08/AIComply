- id: "EUAIA-ART10-001"
  article: "Art. 10(2)"
  title: "Ausencia de validación de datos de entrada o mitigación de sesgos"
  severity: "MEDIUM"
  risk_tier: "high_risk"
  description: "Los conjuntos de datos de entrenamiento, validación y prueba deben someterse a prácticas apropiadas de gobernanza y mitigación de sesgos."
  remediation: "Integrar esquemas de validación de entradas (ej. Pydantic, Pandera) y comprobaciones de distribución de datos antes de la inferencia."
  max_fine: "15M€ o 3% facturación global"
  confidence: "LOW"
  patterns:
    - type: "regex"
      target: "(?i)validate_dataset\\s*=\\s*False"
    - type: "regex"
      target: "(?i)skip_data_validation"