- id: "EUAIA-ART13-001"
  article: "Art. 50(1) / Art. 13"
  title: "Falta de notificación explícita de interacción con IA"
  severity: "HIGH"
  risk_tier: "limited_risk"
  description: "La configuración observada requiere revisar información e instrucciones del sistema de alto riesgo bajo el Art. 13. La información a personas que interactúan con IA es una obligación distinta del Art. 50(1), con condiciones y excepciones propias."
  remediation: "Incluir disclaimers de transparencia en los endpoints o salidas que entregan contenido directamente a usuarios finales."
  max_fine: "15M€ o 3% facturación global"
  confidence: "LOW"
  patterns:
    - type: "regex"
      target: "(?i)ai_disclaimer\\s*=\\s*False"