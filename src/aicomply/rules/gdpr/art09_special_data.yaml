- id: "GDPR-ART09-001"
  article: "RGPD Art. 9"
  title: "Tratamiento de categorías especiales de datos biométricos o genéticos"
  severity: "CRITICAL"
  risk_tier: "high_risk"
  description: "Procesamiento de datos sensibles (biométricos, salud, orientación sexual, opiniones políticas) mediante pipelines de IA sin mecanismos explícitos de anonimización o consentimiento reforzado."
  remediation: "Implementar filtros de desidentificación (presidio, regex de PII) o eliminar campos biométricos no esenciales antes de procesar los lotes de datos."
  max_fine: "20M€ o 4% facturación global"
  confidence: "MEDIUM"
  patterns:
    - type: "ast_call"
      target: "extract_biometric_features"
    - type: "regex"
      target: "(?i)process_health_records\\s*=\\s*True"