- id: "GDPR-ART05-002"
  article: "RGPD Art. 5(1)(c) / Art. 9"
  title: "Presencia de números de identificación nacional (DNI/NIE) en código o prompts estáticos"
  severity: "HIGH"
  risk_tier: "high_risk"
  description: "Inclusión explícita de identificadores personales españoles (DNI/NIE) en templates de prompts, fixtures de prueba en producción o variables de código."
  remediation: "Anonimizar o pseudonimizar identificadores nacionales mediante sintetización de datos o módulos de ofuscación (Presidio/Faker)."
  max_fine: "20M€ o 4% facturación global"
  confidence: "MEDIUM"
  patterns:
    - type: "regex"
      target: "(?i)\\b[0-9]{8}[TRWAGMYFPDXBNJZSQVHLCKE]\\b"
    - type: "regex"
      target: "(?i)\\b[XYZ][0-9]{7}[TRWAGMYFPDXBNJZSQVHLCKE]\\b"

- id: "GDPR-ART05-003"
  article: "RGPD Art. 5(1)(f) / Art. 32"
  title: "Inserción de números de tarjeta de crédito (PAN) en payloads de IA"
  severity: "CRITICAL"
  risk_tier: "high_risk"
  description: "Detección de patrones numéricos compatibles con números de tarjeta bancaria (Visa, Mastercard, Amex) dentro de flujos de código que alimentan modelos de IA."
  remediation: "Implementar filtros de enmascaramiento y cumplimiento PCI-DSS antes de enviar secuencias de texto al pipeline de inferencia."
  max_fine: "20M€ o 4% facturación global"
  confidence: "MEDIUM"
  patterns:
    - type: "regex"
      target: "\\b4[0-9]{12}(?:[0-9]{3})?\\b"
    - type: "regex"
      target: "\\b5[1-5][0-9]{14}\\b"
    - type: "regex"
      target: "\\b3[47][0-9]{13}\\b"