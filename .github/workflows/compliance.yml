name: EU AI Act & GDPR Technical Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  aicomply-audit:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: "utf-8"
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan with the checked-out Action
        uses: ./
        with:
          format: sarif
          output: aicomply-results.sarif
          upload-sarif: "true"
