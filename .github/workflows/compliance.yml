name: EU AI Act & GDPR Technical Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  aicomply-audit:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: "utf-8"
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked scanner
        run: |
          python -m pip install uv==0.8.22
          uv sync --locked --no-dev --no-editable
      - name: Scan and verify reviewed repository findings
        id: scan
        run: uv run --frozen --no-dev --no-editable python scripts/check_self_scan.py --output "$RUNNER_TEMP/aicomply-results.sarif"
      - name: Upload all findings
        uses: github/codeql-action/upload-sarif@v4
        if: >-
          ${{ !cancelled() && steps.scan.outputs.sarif_ready == 'true' &&
              github.actor != 'dependabot[bot]' &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          sarif_file: ${{ runner.temp }}/aicomply-results.sarif
          category: "aicomply-eu-ai-act-gdpr"
