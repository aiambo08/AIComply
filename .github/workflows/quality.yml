name: Quality and distributions

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned package manager
        run: python -m pip install uv==0.8.22
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv run --frozen python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          from packaging.version import Version
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag != str(Version(version)):
              raise SystemExit("Release tag must match canonical project.version (e.g. v2.0.0a0)")
          PY
      - name: Lint, type check, test, build and verify installed wheel
        run: uv run --frozen python scripts/check_quality.py
      - name: Save verified distributions
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
